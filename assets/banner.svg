<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="glowGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="glowGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#c084fc" stop-opacity=".2"/><stop offset="100%" stop-color="#c084fc" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><filter id="glow"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.15) translate(20px,-15px);opacity:.6}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.6}}.bg-pulse-1{animation:pulseGlow 8s ease-in-out infinite alternate;transform-origin:200px 100px}.bg-pulse-2{animation:pulseGlow 10s ease-in-out infinite alternate;transform-origin:1000px 260px}.floating-pill-1{animation:floatPill1 5s ease-in-out infinite}.floating-pill-2{animation:floatPill2 6s ease-in-out infinite}.grid-line{stroke:#334155;stroke-opacity:.25;stroke-width:1}.flow-stream{stroke:url(#accentGrad);stroke-width:2;stroke-dasharray:6 10;animation:dashCycle 6s linear infinite}.title-text{font-weight:800;font-size:46px;fill:#fff;letter-spacing:-1px}.sub-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.sub-text{font-weight:400;font-size:19px;fill:#94a3b8;letter-spacing:.2px}.tag-text{font-weight:600;font-size:13px;fill:#cbd5e1}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="220" cy="110" r="180" fill="url(#glowGrad1)" class="bg-pulse-1"/><circle cx="980" cy="240" r="220" fill="url(#glowGrad2)" class="bg-pulse-2"/><g><line x1="80" x2="80" y1="0" y2="360" class="grid-line"/><line x1="240" x2="240" y1="0" y2="360" class="grid-line"/><line x1="400" x2="400" y1="0" y2="360" class="grid-line"/><line x1="560" x2="560" y1="0" y2="360" class="grid-line"/><line x1="720" x2="720" y1="0" y2="360" class="grid-line"/><line x1="880" x2="880" y1="0" y2="360" class="grid-line"/><line x1="1040" x2="1040" y1="0" y2="360" class="grid-line"/><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/></g><path fill="none" d="M 80,180 Q 300,90 600,180 T 1120,180" class="flow-stream"/><g class="floating-pill-1" filter="url(#cardShadow)" transform="translate(860, 50)"><rect width="260" height="64" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".3" stroke-width="1.2" rx="14"/><circle cx="32" cy="32" r="8" fill="#10b981" filter="url(#glow)"/><text x="52" y="28" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">GRID STATUS</text><text x="52" y="47" fill="#94a3b8" font-family="sans-serif" font-size="12">Real Devices &amp; Cloud Ready</text></g><g class="floating-pill-2" filter="url(#cardShadow)" transform="translate(890, 230)"><rect width="230" height="64" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".3" stroke-width="1.2" rx="14"/><circle cx="30" cy="32" r="8" fill="#818cf8" filter="url(#glow)"/><text x="48" y="28" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="700">AUTOMATION MATRICES</text><text x="48" y="47" fill="#94a3b8" font-family="sans-serif" font-size="12">Playwright • Cypress • Selenium</text></g><g transform="translate(80, 75)"><rect width="248" height="30" fill="#38bdf8" fill-opacity=".12" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.2" rx="15"/><text x="16" y="20" fill="#38bdf8" class="tag-text">⚡ CURATED TESTING ECOSYSTEM</text><text x="0" y="85" class="title-text">Awesome Browser Testing</text><text x="0" y="128" class="sub-text">The definitive directory for <tspan fill="#38bdf8" font-weight="600">Cross-Browser Automation</tspan>, <tspan fill="#818cf8" font-weight="600">Real-Device Clouds</tspan>,</text><text x="0" y="156" class="sub-text">and scalable self-hosted grids for modern Quality Engineering.</text><g transform="translate(0, 195)"><rect width="130" height="34" x="0" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="8"/><text x="18" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🌐 Real Devices</text><rect width="150" height="34" x="142" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="8"/><text x="160" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🚀 Parallel Grids</text><rect width="150" height="34" x="304" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="8"/><text x="322" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🤖 Self-Healing AI</text><rect width="150" height="34" x="466" y="0" fill="#1e293b" fill-opacity=".8" stroke="#334155" stroke-width="1" rx="8"/><text x="484" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📦 Open Source</text></g></g></svg>