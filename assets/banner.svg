<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <!-- Glassmorphic Card Pattern -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.3; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(380px); opacity: 0; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }

    .bg-pulse-1 {
      animation: pulseGlow 8s ease-in-out infinite alternate;
      transform-origin: 200px 100px;
    }
    .bg-pulse-2 {
      animation: pulseGlow 10s ease-in-out infinite alternate;
      transform-origin: 1000px 260px;
    }
    .floating-pill-1 {
      animation: floatPill1 5s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatPill2 6s ease-in-out infinite;
    }
    .grid-line {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
    }
    .flow-stream {
      stroke: url(#accentGrad);
      stroke-width: 2;
      stroke-dasharray: 6 10;
      animation: dashCycle 6s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #cbd5e1;
    }
  </style>

  <!-- Deep Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Blobs in Background -->
  <circle class="bg-pulse-1" cx="220" cy="110" r="180" fill="url(#glowGrad1)" />
  <circle class="bg-pulse-2" cx="980" cy="240" r="220" fill="url(#glowGrad2)" />

  <!-- Subtle Matrix / Circuit Grid -->
  <g>
    <line x1="80" y1="0" x2="80" y2="360" class="grid-line" />
    <line x1="240" y1="0" x2="240" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="560" y1="0" x2="560" y2="360" class="grid-line" />
    <line x1="720" y1="0" x2="720" y2="360" class="grid-line" />
    <line x1="880" y1="0" x2="880" y2="360" class="grid-line" />
    <line x1="1040" y1="0" x2="1040" y2="360" class="grid-line" />

    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Animated Data Flow Line (Background/Middle) -->
  <path d="M 80,180 Q 300,90 600,180 T 1120,180" fill="none" class="flow-stream" />

  <!-- Subtle Top Decorative Floating Status Card (Right Side) -->
  <g class="floating-pill-1" transform="translate(860, 50)" filter="url(#cardShadow)">
    <rect width="260" height="64" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="32" cy="32" r="8" fill="#10b981" filter="url(#glow)" />
    <text x="52" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">GRID STATUS</text>
    <text x="52" y="47" font-family="sans-serif" font-size="12" fill="#94a3b8">Real Devices &amp; Cloud Ready</text>
  </g>

  <!-- Subtle Bottom Decorative Floating Card (Right Side) -->
  <g class="floating-pill-2" transform="translate(890, 230)" filter="url(#cardShadow)">
    <rect width="230" height="64" rx="14" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2" />
    <circle cx="30" cy="32" r="8" fill="#818cf8" filter="url(#glow)" />
    <text x="48" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#f8fafc">AUTOMATION MATRICES</text>
    <text x="48" y="47" font-family="sans-serif" font-size="12" fill="#94a3b8">Playwright • Cypress • Selenium</text>
  </g>

  <!-- Foreground Content: Header Pill, Title & Subtitles (Crisp & Readable) -->
  <g transform="translate(80, 75)">
    <!-- Category Badge Pill -->
    <rect width="248" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <text x="16" y="20" class="tag-text" fill="#38bdf8">⚡ CURATED TESTING ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">
      Awesome Browser Testing
    </text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="128" class="sub-text">
      The definitive directory for <tspan fill="#38bdf8" font-weight="600">Cross-Browser Automation</tspan>, <tspan fill="#818cf8" font-weight="600">Real-Device Clouds</tspan>,
    </text>
    <!-- Subtitle Line 2 -->
    <text x="0" y="156" class="sub-text">
      and scalable self-hosted grids for modern Quality Engineering.
    </text>

    <!-- Technology Pills Row -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="18" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 Real Devices</text>

      <!-- Pill 2 -->
      <rect x="142" y="0" width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="160" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 Parallel Grids</text>

      <!-- Pill 3 -->
      <rect x="304" y="0" width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="322" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Self-Healing AI</text>

      <!-- Pill 4 -->
      <rect x="466" y="0" width="150" height="34" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="484" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 Open Source</text>
    </g>
  </g>
</svg>
